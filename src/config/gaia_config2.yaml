  lr: 0.001
  nodes: ts-basic-service ts-preserve-service ts-route-plan-service ts-auth-service
    ts-security-service mysql ts-ui-dashboard ts-travel-service ts-food-service ts-station-service
    ts-seat-service ts-order-service ts-travel-plan-service ts-route-service ts-inside-payment-service
    ts-order-other-service ts-travel2-service ts-consign-service ts-train-service
    ts-user-service ts-price-service ts-config-service ts-payment-service ts-assurance-service
    ts-consign-price-service ts-verification-code-service ts-train-food-service ts-contacts-service
    ts-voucher-service ts-station-food-service ts-execute-service ts-notification-service
  run_table: gt.csv
  save_dir: dgl/stratification_10
  save_model: true
  seed: 2
  text_path: parse/stratification_texts.pkl
  weight_decay: 0.0001
  win_size: 10
  win_threshold: 0.0001
